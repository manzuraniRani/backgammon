<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>שש בש מקוון</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#1a0f00;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
#app{width:100%;max-width:900px}

/* ---- LOBBY ---- */
.lobby-wrap{max-width:420px;margin:0 auto}
.logo{text-align:center;padding:2rem 0 1rem}
.logo-title{font-size:32px;font-weight:bold;color:#d4a843;letter-spacing:2px}
.logo-sub{font-size:14px;color:#a07830;margin-top:4px}
.lobby-card{background:#2d1a00;border:1px solid #5a3a10;border-radius:16px;padding:1.75rem}
.field{margin-bottom:1rem}
.field label{display:block;font-size:13px;font-weight:bold;color:#d4a843;margin-bottom:6px}
.field input{width:100%;padding:10px 12px;font-size:15px;border:1px solid #5a3a10;border-radius:8px;outline:none;font-family:Arial,sans-serif;direction:rtl;background:#1a0f00;color:#f5e6c8}
.field input:focus{border-color:#d4a843;box-shadow:0 0 0 3px rgba(212,168,67,0.2)}
.err{font-size:13px;color:#e07070;min-height:18px;margin-top:6px}
.btn{width:100%;padding:13px;font-size:15px;font-weight:bold;cursor:pointer;border-radius:10px;border:none;font-family:Arial,sans-serif;margin-top:0.5rem}
.btn-gold{background:#d4a843;color:#1a0f00}
.btn-gold:hover{background:#e0b850}
.btn-outline{background:transparent;color:#d4a843;border:1px solid #d4a843}
.btn-outline:hover{background:rgba(212,168,67,0.1)}
.btn-gray{background:#333;color:#aaa;border:1px solid #555}
.btn-gray:hover{background:#444}
.divider{text-align:center;font-size:13px;color:#5a3a10;margin:1rem 0}

/* ---- WAITING ---- */
.wait-wrap{max-width:420px;margin:0 auto;text-align:center;padding-top:2rem}
.code-box{background:#2d1a00;border:2px dashed #5a3a10;border-radius:12px;padding:1.5rem;margin:1.5rem 0}
.code-label{font-size:13px;color:#a07830;margin-bottom:8px}
.code-num{font-size:48px;font-weight:bold;color:#d4a843;letter-spacing:12px}
.code-hint{font-size:12px;color:#5a3a10;margin-top:8px}
.spin-box{display:flex;align-items:center;justify-content:center;gap:10px;color:#a07830;font-size:14px;margin-bottom:1.5rem}
.spinner{width:16px;height:16px;border:2px solid #5a3a10;border-top-color:#d4a843;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- GAME LAYOUT ---- */
.game-wrap{display:grid;grid-template-columns:1fr 280px;gap:12px;align-items:start}
.board-col{}
.side-col{display:flex;flex-direction:column;gap:10px}

/* ---- BOARD ---- */
.board-outer{background:#2d1a00;border:3px solid #5a3a10;border-radius:12px;padding:8px;position:relative}
.board-inner{display:grid;grid-template-columns:repeat(13,1fr);grid-template-rows:auto 40px auto;background:#8B4513;border-radius:6px;overflow:hidden;min-height:320px}
.point{display:flex;flex-direction:column;align-items:center;padding:4px 2px;cursor:pointer;position:relative;min-height:130px}
.point:hover{background:rgba(255,255,255,0.08)}
.point.highlight{background:rgba(212,168,67,0.25)}
.point.valid-move{background:rgba(100,220,100,0.2);cursor:pointer}
.point-top{border-radius:0 0 50% 50%}
.point-bottom{border-radius:50% 50% 0 0;flex-direction:column-reverse}
.tri-light{background:#d4a843}
.tri-dark{background:#8B0000}
.point-num{font-size:9px;color:rgba(255,255,255,0.4);text-align:center;position:absolute;bottom:2px}
.point-top .point-num{bottom:auto;top:2px}
.bar-col{background:#5a3a10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px}
.bar-label{font-size:9px;color:#a07830;writing-mode:vertical-lr;margin:4px 0}
.checker{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:bold;flex-shrink:0;border:2px solid rgba(0,0,0,0.3);cursor:pointer;position:relative}
.checker-white{background:radial-gradient(circle at 35% 35%,#fff,#ccc);color:#333;border-color:#999}
.checker-black{background:radial-gradient(circle at 35% 35%,#555,#111);color:#eee;border-color:#000}
.checker.selected{box-shadow:0 0 0 3px #d4a843;z-index:2}
.checker-count{font-size:8px;font-weight:bold}
.mid-row{background:#5a3a10;display:flex;align-items:center;justify-content:center}
.home-area{background:#3d2200;border:1px solid #5a3a10;border-radius:6px;padding:6px;min-width:36px;display:flex;flex-direction:column;align-items:center;gap:3px}
.home-label{font-size:10px;color:#a07830;margin-bottom:3px}
.home-checker{width:20px;height:10px;border-radius:10px}

/* ---- DICE ---- */
.dice-area{display:flex;gap:8px;align-items:center;justify-content:center;padding:6px 0}
.die{width:36px;height:36px;background:#f5f5f5;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;color:#1a0f00;border:2px solid #d4a843;box-shadow:2px 2px 0 rgba(0,0,0,0.3)}
.die.used{opacity:0.3;border-color:#555}
.die.rolling{animation:rolldie 0.4s ease-out}
@keyframes rolldie{0%{transform:rotate(0) scale(1.3)}100%{transform:rotate(360deg) scale(1)}}
.btn-roll{padding:8px 18px;font-size:13px;font-weight:bold;cursor:pointer;border-radius:8px;border:none;background:#d4a843;color:#1a0f00;font-family:Arial}
.btn-roll:hover{background:#e0b850}
.btn-roll:disabled{background:#555;color:#888;cursor:default}

/* ---- PLAYER CARDS ---- */
.player-card{background:#2d1a00;border:1px solid #5a3a10;border-radius:10px;padding:10px 12px}
.player-card.active{border-color:#d4a843}
.pc-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.pc-checker{width:18px;height:18px;border-radius:50%;flex-shrink:0}
.pc-name{font-size:13px;font-weight:bold;color:#f5e6c8;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-you{font-size:10px;background:#d4a843;color:#1a0f00;border-radius:8px;padding:1px 7px}
.pc-score{font-size:11px;color:#a07830}
.pc-bar{font-size:11px;color:#e07070}

/* ---- STATUS ---- */
.status-box{background:#2d1a00;border:1px solid #5a3a10;border-radius:10px;padding:10px;text-align:center;font-size:13px;font-weight:bold;color:#d4a843}

/* ---- CHAT ---- */
.chat-box{background:#2d1a00;border:1px solid #5a3a10;border-radius:10px;display:flex;flex-direction:column;height:220px}
.chat-title{font-size:12px;font-weight:bold;color:#a07830;padding:8px 10px;border-bottom:1px solid #5a3a10}
.chat-msgs{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.chat-msg{font-size:12px;line-height:1.4}
.chat-msg-name{font-weight:bold;color:#d4a843}
.chat-msg-text{color:#f5e6c8}
.chat-msg-sys{color:#a07830;font-style:italic}
.chat-input-row{display:flex;gap:6px;padding:6px 8px;border-top:1px solid #5a3a10}
.chat-input{flex:1;padding:5px 8px;font-size:12px;border:1px solid #5a3a10;border-radius:6px;outline:none;background:#1a0f00;color:#f5e6c8;font-family:Arial;direction:rtl}
.chat-input:focus{border-color:#d4a843}
.chat-send{padding:5px 10px;font-size:12px;font-weight:bold;cursor:pointer;border-radius:6px;border:none;background:#d4a843;color:#1a0f00;font-family:Arial}

/* ---- GAME OVER ---- */
.gameover-overlay{background:#2d1a00;border:2px solid #d4a843;border-radius:16px;padding:2rem;text-align:center}
.gameover-title{font-size:28px;font-weight:bold;color:#d4a843;margin-bottom:0.5rem}
.gameover-sub{font-size:14px;color:#a07830;margin-bottom:1.5rem}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:1rem}
.btn-sm{padding:10px;font-size:13px;font-weight:bold;cursor:pointer;border-radius:8px;border:none;font-family:Arial}
</style>
</head>
<body>
<div id="app">

<!-- LOBBY -->
<div id="screen-lobby">
  <div class="lobby-wrap">
    <div class="logo">
      <div class="logo-title">שש בש</div>
      <div class="logo-sub">משחק מקוון בזמן אמת</div>
    </div>
    <div class="lobby-card">
      <div class="field"><label>השם שלך</label><input type="text" id="input-name" placeholder="הכנס שם..." maxlength="18"/></div>
      <button class="btn btn-gold" id="btn-create">צור חדר חדש</button>
      <div class="divider">— או —</div>
      <div class="field"><label style="color:#a07830">הצטרף לחדר קיים</label>
        <input type="text" id="input-code" placeholder="קוד בן 4 ספרות" maxlength="4" style="letter-spacing:6px;font-size:20px;text-align:center"/>
      </div>
      <button class="btn btn-outline" id="btn-join">הצטרף</button>
      <div class="err" id="err-lobby"></div>
    </div>
  </div>
</div>

<!-- WAITING -->
<div id="screen-waiting" style="display:none">
  <div class="wait-wrap">
    <div class="logo-title" style="color:#d4a843">ממתין לחבר</div>
    <div class="code-box">
      <div class="code-label">קוד החדר שלך</div>
      <div class="code-num" id="display-code"></div>
      <div class="code-hint">שלח את הקוד לחבר שלך</div>
    </div>
    <div class="spin-box"><div class="spinner"></div>ממתין לחבר להתחבר...</div>
    <button class="btn btn-gray" id="btn-cancel" style="max-width:200px;margin:0 auto;display:block">ביטול</button>
  </div>
</div>

<!-- GAME -->
<div id="screen-game" style="display:none">
  <div class="game-wrap">
    <div class="board-col">
      <div class="board-outer">
        <div class="board-inner" id="board-inner"></div>
      </div>
      <div class="dice-area" id="dice-area"></div>
    </div>
    <div class="side-col">
      <div class="player-card" id="card-w">
        <div class="pc-row">
          <div class="pc-checker checker-white"></div>
          <div class="pc-name" id="name-w">לבן</div>
          <div id="you-w" style="display:none" class="pc-you">אתה</div>
        </div>
        <div class="pc-score" id="score-w">0 נצחונות</div>
        <div class="pc-bar" id="bar-w" style="display:none"></div>
      </div>
      <div class="status-box" id="status-box">טוען...</div>
      <div class="player-card" id="card-b">
        <div class="pc-row">
          <div class="pc-checker checker-black"></div>
          <div class="pc-name" id="name-b">שחור</div>
          <div id="you-b" style="display:none" class="pc-you">אתה</div>
        </div>
        <div class="pc-score" id="score-b">0 נצחונות</div>
        <div class="pc-bar" id="bar-b" style="display:none"></div>
      </div>
      <div class="chat-box">
        <div class="chat-title">צ'אט</div>
        <div class="chat-msgs" id="chat-msgs"></div>
        <div class="chat-input-row">
          <input type="text" class="chat-input" id="chat-input" placeholder="הקלד הודעה..." maxlength="100"/>
          <button class="chat-send" id="chat-send">שלח</button>
        </div>
      </div>
      <button class="btn btn-gray" id="btn-leave" style="font-size:13px;padding:10px">יציאה מהמשחק</button>
    </div>
  </div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, push, remove }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const cfg = {
  apiKey:"AIzaSyC1-3YgzB9x-XBqvQg1HD7B-WUxeUagf7U",
  authDomain:"tictactoe-d5971.firebaseapp.com",
  databaseURL:"https://tictactoe-d5971-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"tictactoe-d5971",
  storageBucket:"tictactoe-d5971.firebasestorage.app",
  messagingSenderId:"545266842758",
  appId:"1:545266842758:web:1f0aa7c8c930eb428fa507"
};

const db = getDatabase(initializeApp(cfg));

// State
let myName='', myColor='', roomCode='', unsub=null, unsubChat=null;
let selectedPoint = -1; // -1=none, 25=bar-white, 0=bar-black
let lastGameState = null;

// Initial board: point 1-24, positive=white, negative=black
function initBoard() {
  const b = Array(26).fill(0);
  b[1]=2; b[12]=5; b[17]=3; b[19]=5;   // white
  b[24]=-2; b[13]=-5; b[8]=-3; b[6]=-5; // black
  return b;
}

function initGameState(firstTurn) {
  return {
    board: initBoard(),
    turn: firstTurn,
    dice: [],
    diceUsed: [],
    phase: 'roll', // 'roll' | 'move' | 'gameover'
    barWhite: 0,
    barBlack: 0,
    homeWhite: 0,
    homeBlack: 0,
    winner: null,
    scores: { white:0, black:0 }
  };
}

function randCode() { return String(Math.floor(1000+Math.random()*9000)); }

function showScreen(id) {
  ['screen-lobby','screen-waiting','screen-game'].forEach(s=>
    document.getElementById(s).style.display = s===id?'':'none');
}

// ---- LOBBY ----
document.getElementById('btn-create').onclick = async ()=>{
  const name = document.getElementById('input-name').value.trim();
  const err = document.getElementById('err-lobby');
  if (!name){err.textContent='יש להזין שם';return;}
  err.textContent='';
  myName=name; myColor='white'; roomCode=randCode();
  const gs = initGameState('white');
  await set(ref(db,'bg/'+roomCode),{
    playerWhite:name, playerBlack:'',
    status:'waiting',
    game: gs,
    scores:{white:0,black:0},
    ts:Date.now()
  });
  document.getElementById('display-code').textContent=roomCode;
  showScreen('screen-waiting');
  startListening();
};

document.getElementById('btn-join').onclick = async ()=>{
  const name = document.getElementById('input-name').value.trim();
  const code = document.getElementById('input-code').value.trim();
  const err = document.getElementById('err-lobby');
  if (!name){err.textContent='יש להזין שם';return;}
  if (!/^\d{4}$/.test(code)){err.textContent='קוד חייב להיות 4 ספרות';return;}
  err.textContent='';
  const snap = await get(ref(db,'bg/'+code));
  if (!snap.exists()){err.textContent='חדר לא נמצא';return;}
  const d = snap.val();
  if (d.playerBlack){err.textContent='החדר כבר מלא';return;}
  myName=name; myColor='black'; roomCode=code;
  await update(ref(db,'bg/'+code),{playerBlack:name, status:'playing'});
  showScreen('screen-game');
  startListening();
  startChat();
};

document.getElementById('btn-cancel').onclick = ()=>doLeave(true);
document.getElementById('btn-leave').onclick = ()=>doLeave(true);

// ---- LISTENING ----
function startListening() {
  if (unsub) unsub();
  unsub = onValue(ref(db,'bg/'+roomCode), snap=>{
    if (!snap.exists()){doLeave(false);return;}
    const d = snap.val();
    if (myColor==='white' && d.status==='waiting'){showScreen('screen-waiting');return;}
    if (d.status==='playing'||d.status==='gameover'){
      showScreen('screen-game');
      if (!unsubChat) startChat();
      lastGameState = d;
      renderGame(d);
    }
  });
}

function startChat() {
  if (unsubChat) unsubChat();
  unsubChat = onValue(ref(db,'bg/'+roomCode+'/chat'), snap=>{
    const msgs = snap.val()||{};
    const el = document.getElementById('chat-msgs');
    el.innerHTML='';
    Object.values(msgs).sort((a,b)=>a.ts-b.ts).forEach(m=>{
      const div=document.createElement('div');
      div.className='chat-msg';
      if (m.sys){div.innerHTML=`<span class="chat-msg-sys">${m.text}</span>`;}
      else{div.innerHTML=`<span class="chat-msg-name">${esc(m.name)}: </span><span class="chat-msg-text">${esc(m.text)}</span>`;}
      el.appendChild(div);
    });
    el.scrollTop=el.scrollHeight;
  });
}

document.getElementById('chat-send').onclick = sendChat;
document.getElementById('chat-input').onkeydown = e=>{ if(e.key==='Enter') sendChat(); };
async function sendChat(){
  const inp=document.getElementById('chat-input');
  const text=inp.value.trim();
  if (!text) return;
  inp.value='';
  await push(ref(db,'bg/'+roomCode+'/chat'),{name:myName,text,ts:Date.now()});
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ---- RENDER GAME ----
function renderGame(d) {
  const g = d.game;
  // Names
  document.getElementById('name-w').textContent = d.playerWhite||'לבן';
  document.getElementById('name-b').textContent = d.playerBlack||'שחור';
  document.getElementById('you-w').style.display = myColor==='white'?'inline-block':'none';
  document.getElementById('you-b').style.display = myColor==='black'?'inline-block':'none';
  document.getElementById('score-w').textContent = (g.scores?.white||0)+' נצחונות';
  document.getElementById('score-b').textContent = (g.scores?.black||0)+' נצחונות';

  const bw=g.barWhite||0, bb=g.barBlack||0;
  const barWEl=document.getElementById('bar-w'), barBEl=document.getElementById('bar-b');
  barWEl.style.display=bw>0?'block':'none'; barWEl.textContent='בבר: '+bw;
  barBEl.style.display=bb>0?'block':'none'; barBEl.textContent='בבר: '+bb;

  document.getElementById('card-w').className='player-card'+(g.turn==='white'?' active':'');
  document.getElementById('card-b').className='player-card'+(g.turn==='black'?' active':'');

  renderStatus(d);
  renderBoard(d);
  renderDice(d);
}

function renderStatus(d) {
  const g=d.game;
  const el=document.getElementById('status-box');
  if (g.phase==='gameover'){
    const wname=g.winner==='white'?d.playerWhite:d.playerBlack;
    el.textContent=(g.winner===myColor?'ניצחת! 🎉':wname+' ניצח');
    return;
  }
  const isMyTurn=g.turn===myColor;
  if (!isMyTurn){
    const oname=myColor==='white'?d.playerBlack:d.playerWhite;
    el.textContent='תורו של '+oname+'...';return;
  }
  if (g.phase==='roll') el.textContent='זרוק את הקוביות!';
  else if (g.phase==='move'){
    if (selectedPoint>=0) el.textContent='בחר יעד להזזה';
    else el.textContent='בחר כלי להזזה';
  }
}

// ---- BOARD RENDER ----
function renderBoard(d) {
  const g=d.game;
  const board=g.board||Array(26).fill(0);
  const isMyTurn=g.turn===myColor && g.phase==='move';
  const validMoves = isMyTurn ? getValidMoves(g) : [];

  const el=document.getElementById('board-inner');
  el.innerHTML='';

  // Top row: points 13-24 (black goes from 13→24, white from 24→13 perspective)
  // We show from white's perspective: top=13..24, bottom=12..1
  // Top points (13-24) displayed left to right
  for (let p=13;p<=24;p++){
    el.appendChild(makePoint(p,'top',board,isMyTurn,validMoves,g));
    if (p===18){el.appendChild(makeBar(g,'top'));}
  }
  // Middle row
  const mid=document.createElement('div');
  mid.className='mid-row'; mid.style.gridColumn='1/14'; mid.style.height='40px';
  // home areas in middle
  el.appendChild(mid);
  // Bottom row: points 12→1 displayed left to right
  for (let p=12;p>=1;p--){
    if (p===7){el.appendChild(makeBar(g,'bottom'));}
    el.appendChild(makePoint(p,'bottom',board,isMyTurn,validMoves,g));
  }
}

function makePoint(p, pos, board, isMyTurn, validMoves, g) {
  const div=document.createElement('div');
  const isLight=(p%2===0);
  div.className=`point point-${pos} ${isLight?'tri-light':'tri-dark'}`;
  div.style.cssText='display:flex;flex-direction:column;align-items:center;padding:3px 2px;cursor:pointer;min-height:130px;';
  if (pos==='bottom') div.style.flexDirection='column-reverse';
  div.style.background=isLight?'#c49a2a':'#8B0000';

  const count=board[p];
  const color=count>0?'white':'black';
  const abs=Math.abs(count);

  // highlight if selected source
  if (selectedPoint===p) div.style.outline='3px solid #d4a843';

  // highlight if valid move destination
  const isValidDest = selectedPoint>=0 && validMoves.some(m=>m.from===selectedPoint && m.to===p);
  if (isValidDest) div.style.background='rgba(100,220,100,0.35)';

  // highlight if has selectable piece
  const isSelectableSource = isMyTurn && selectedPoint<0 && abs>0 &&
    ((g.barWhite>0&&myColor==='white')||(g.barBlack>0&&myColor==='black')
      ? false
      : validMoves.some(m=>m.from===p));
  // bar must move first
  const barCount = myColor==='white'?g.barWhite:g.barBlack;
  const canSelect = isMyTurn && abs>0 && color===myColor && barCount===0 &&
    validMoves.some(m=>m.from===p);
  if (canSelect && selectedPoint<0) div.style.outline='2px solid rgba(212,168,67,0.5)';

  for (let i=0;i<Math.min(abs,5);i++){
    const ch=makeChecker(color, abs>1&&i===0?abs:null, selectedPoint===p&&i===0);
    div.appendChild(ch);
  }

  const numDiv=document.createElement('div');
  numDiv.className='point-num'; numDiv.textContent=p;
  div.appendChild(numDiv);

  div.onclick=()=>handlePointClick(p,g);
  return div;
}

function makeBar(g, pos) {
  const div=document.createElement('div');
  div.className='bar-col';
  div.style.cssText='background:#5a3a10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px;';

  if (pos==='top' && g.barBlack>0){
    for(let i=0;i<Math.min(g.barBlack,3);i++) div.appendChild(makeChecker('black',i===0?g.barBlack:null,selectedPoint===0));
    if(myColor==='black'&&g.turn==='black'&&g.phase==='move'){
      div.onclick=()=>handlePointClick(0,g);
      div.style.cursor='pointer';
      if(selectedPoint<0) div.style.outline='2px solid rgba(212,168,67,0.5)';
    }
  }
  if (pos==='bottom' && g.barWhite>0){
    for(let i=0;i<Math.min(g.barWhite,3);i++) div.appendChild(makeChecker('white',i===0?g.barWhite:null,selectedPoint===25));
    if(myColor==='white'&&g.turn==='white'&&g.phase==='move'){
      div.onclick=()=>handlePointClick(25,g);
      div.style.cursor='pointer';
      if(selectedPoint<0) div.style.outline='2px solid rgba(212,168,67,0.5)';
    }
  }
  return div;
}

function makeChecker(color, count, isSelected) {
  const div=document.createElement('div');
  div.className='checker '+(color==='white'?'checker-white':'checker-black')+(isSelected?' selected':'');
  if (count&&count>1) div.innerHTML=`<span class="checker-count">${count}</span>`;
  return div;
}

// ---- DICE ----
function renderDice(d) {
  const g=d.game;
  const el=document.getElementById('dice-area');
  el.innerHTML='';
  const isMyTurn=g.turn===myColor;

  if (g.phase==='roll' && isMyTurn){
    const btn=document.createElement('button');
    btn.className='btn-roll'; btn.textContent='זרוק קוביות 🎲';
    btn.onclick=()=>rollDice(g);
    el.appendChild(btn);
  } else if (g.dice && g.dice.length>0){
    const faces=['','⚀','⚁','⚂','⚃','⚄','⚅'];
    const used=g.diceUsed||[];
    // show all dice (doubles = 4)
    const toShow = g.dice.length===2&&g.dice[0]===g.dice[1]
      ? [g.dice[0],g.dice[0],g.dice[0],g.dice[0]]
      : [...g.dice];
    toShow.forEach((v,i)=>{
      const div=document.createElement('div');
      div.className='die'+(used[i]?' used':'');
      div.textContent=faces[v]||v;
      el.appendChild(div);
    });

    if (isMyTurn && g.phase==='move'){
      const btn=document.createElement('button');
      btn.className='btn-roll'; btn.textContent='דלג על תור';
      btn.style.marginRight='8px';
      btn.onclick=()=>skipTurn(g);
      el.appendChild(btn);
    }
  }
}

// ---- GAME LOGIC ----
async function rollDice(g) {
  if (g.turn!==myColor||g.phase!=='roll') return;
  let d1=Math.ceil(Math.random()*6), d2=Math.ceil(Math.random()*6);
  const dice=[d1,d2];
  const diceUsed=dice[0]===dice[1]?[false,false,false,false]:[false,false];
  const newG={...g, dice, diceUsed, phase:'move'};

  // check if any moves exist
  if (getValidMoves(newG).length===0){
    await sysChat('אין מהלכים אפשריים — התור עובר');
    const next=g.turn==='white'?'black':'white';
    await update(ref(db,'bg/'+roomCode+'/game'),{dice,diceUsed,phase:'roll',turn:next});
    return;
  }
  await update(ref(db,'bg/'+roomCode+'/game'),{dice,diceUsed,phase:'move'});
}

function handlePointClick(point, g) {
  if (g.turn!==myColor||g.phase!=='move') return;
  const barCount=myColor==='white'?g.barWhite:g.barBlack;
  const barPoint=myColor==='white'?25:0;

  // if have bar pieces, must play from bar
  if (barCount>0 && point!==barPoint) {
    selectedPoint=barPoint; renderGame(lastGameState); return;
  }

  if (selectedPoint<0){
    // select source
    const board=g.board;
    const count=board[point]||0;
    const color=count>0?'white':'black';
    const isBar=(point===25||point===0);
    const hasBar=barCount>0;
    if (hasBar && !isBar) return;
    if (!isBar && (color!==myColor||Math.abs(count)===0)) return;
    const moves=getValidMoves(g);
    if (!moves.some(m=>m.from===point)) return;
    selectedPoint=point;
    renderGame(lastGameState);
  } else {
    // try to move
    const moves=getValidMoves(g);
    const validDests=moves.filter(m=>m.from===selectedPoint&&m.to===point);
    if (validDests.length>0){
      applyMove(validDests[0], g);
      selectedPoint=-1;
    } else if (point===selectedPoint){
      selectedPoint=-1;
      renderGame(lastGameState);
    } else {
      // re-select
      const board=g.board;
      const count=board[point]||0;
      const color=count>0?'white':'black';
      if (color===myColor&&Math.abs(count)>0&&moves.some(m=>m.from===point)){
        selectedPoint=point;
        renderGame(lastGameState);
      } else {
        selectedPoint=-1;
        renderGame(lastGameState);
      }
    }
  }
}

async function applyMove(move, g) {
  const board=[...g.board];
  let barWhite=g.barWhite||0, barBlack=g.barBlack||0;
  let homeWhite=g.homeWhite||0, homeBlack=g.homeBlack||0;
  const diceUsed=[...(g.diceUsed||[])];

  // remove from source
  if (move.from===25) barWhite--;
  else if (move.from===0) barBlack--;
  else board[move.from]+=(myColor==='white'?-1:1);

  // bearing off
  if (move.to===0&&myColor==='white'){ homeWhite++; }
  else if (move.to===25&&myColor==='black'){ homeBlack++; }
  else {
    // check hit
    const dest=board[move.to]||0;
    if (myColor==='white'&&dest===-1){ board[move.to]=1; barBlack++; }
    else if (myColor==='black'&&dest===1){ board[move.to]=-1; barWhite++; }
    else board[move.to]+=(myColor==='white'?1:-1);
  }

  // mark die used
  diceUsed[move.dieIdx]=true;

  // check win
  if (homeWhite>=15||homeBlack>=15){
    const winner=homeWhite>=15?'white':'black';
    const scores={...(g.scores||{white:0,black:0})};
    scores[winner]=(scores[winner]||0)+1;
    await update(ref(db,'bg/'+roomCode+'/game'),{board,barWhite,barBlack,homeWhite,homeBlack,diceUsed,winner,phase:'gameover',scores});
    await sysChat((winner===myColor?myName:getOtherName())+' ניצח במשחק!');
    return;
  }

  // check remaining moves
  const tempG={...g,board,barWhite,barBlack,homeWhite,homeBlack,diceUsed};
  const remaining=getValidMoves(tempG);
  if (remaining.length===0){
    const next=g.turn==='white'?'black':'white';
    await update(ref(db,'bg/'+roomCode+'/game'),{board,barWhite,barBlack,homeWhite,homeBlack,diceUsed,phase:'roll',turn:next,dice:[],diceUsed:[]});
  } else {
    await update(ref(db,'bg/'+roomCode+'/game'),{board,barWhite,barBlack,homeWhite,homeBlack,diceUsed});
  }
}

async function skipTurn(g) {
  const next=g.turn==='white'?'black':'white';
  await update(ref(db,'bg/'+roomCode+'/game'),{phase:'roll',turn:next,dice:[],diceUsed:[]});
}

function getOtherName(){
  if (!lastGameState) return 'יריב';
  return myColor==='white'?lastGameState.playerBlack:lastGameState.playerWhite;
}

// ---- VALID MOVES ----
function getValidMoves(g) {
  const board=g.board||Array(26).fill(0);
  const dice=g.dice||[];
  const diceUsed=g.diceUsed||[];
  const isWhite=g.turn==='white';
  const barW=g.barWhite||0, barB=g.barBlack||0;
  const barCount=isWhite?barW:barB;
  const homeW=g.homeWhite||0, homeB=g.homeBlack||0;
  const moves=[];

  // available dice values
  const isDoubles=dice.length===2&&dice[0]===dice[1];
  const allDice=isDoubles?[dice[0],dice[0],dice[0],dice[0]]:[...dice];

  const availDice=allDice.map((v,i)=>({v,i,used:diceUsed[i]})).filter(d=>!d.used);
  if (availDice.length===0) return [];

  const uniqueDice=[...new Set(availDice.map(d=>({v:d.v,i:d.i})).map(x=>x.v))].map(v=>{
    const d=availDice.find(x=>x.v===v);
    return {v,i:d.i};
  });

  // can bear off?
  const canBearOff = isWhite
    ? (barW===0 && allPiecesHome(board,'white',homeW))
    : (barB===0 && allPiecesHome(board,'black',homeB));

  if (barCount>0){
    const fromPoint=isWhite?25:0;
    uniqueDice.forEach(({v,i})=>{
      const to=isWhite?v:(25-v);
      if (to>=1&&to<=24){
        const dest=board[to]||0;
        const blocked=isWhite?(dest<=-2):(dest>=2);
        if (!blocked) moves.push({from:fromPoint,to,dieIdx:i,die:v});
      }
    });
    return moves;
  }

  // normal moves
  for (let p=1;p<=24;p++){
    const count=board[p]||0;
    if (isWhite&&count<=0) continue;
    if (!isWhite&&count>=0) continue;

    uniqueDice.forEach(({v,i})=>{
      if (isWhite){
        const to=p+v;
        if (to<=24){
          const dest=board[to]||0;
          if (dest>=-1) moves.push({from:p,to,dieIdx:i,die:v});
        } else if (canBearOff){
          // bear off
          const exact=p+v===25;
          const highest=!board.slice(p+1,25).some(x=>x>0);
          if (exact||(to>25&&highest)) moves.push({from:p,to:0,dieIdx:i,die:v});
        }
      } else {
        const to=p-v;
        if (to>=1){
          const dest=board[to]||0;
          if (dest<=1) moves.push({from:p,to,dieIdx:i,die:v});
        } else if (canBearOff){
          const exact=p-v===0;
          const lowest=!board.slice(1,p).some(x=>x<0);
          if (exact||(to<0&&lowest)) moves.push({from:p,to:25,dieIdx:i,die:v});
        }
      }
    });
  }
  return moves;
}

function allPiecesHome(board, color, homePieces) {
  if (color==='white'){
    let total=homePieces;
    for(let p=19;p<=24;p++) if(board[p]>0) total+=board[p];
    return total>=15;
  } else {
    let total=homePieces;
    for(let p=1;p<=6;p++) if(board[p]<0) total+=Math.abs(board[p]);
    return total>=15;
  }
}

async function sysChat(text){
  await push(ref(db,'bg/'+roomCode+'/chat'),{sys:true,text,ts:Date.now()});
}

function doLeave(clean=true){
  if (unsub){unsub();unsub=null;}
  if (unsubChat){unsubChat();unsubChat=null;}
  if (clean&&roomCode){
    if (myColor==='white') remove(ref(db,'bg/'+roomCode));
    else update(ref(db,'bg/'+roomCode),{playerBlack:'',status:'waiting'});
  }
  myName='';myColor='';roomCode='';selectedPoint=-1;lastGameState=null;
  document.getElementById('input-name').value='';
  document.getElementById('input-code').value='';
  document.getElementById('err-lobby').textContent='';
  showScreen('screen-lobby');
}
</script>
