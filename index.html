<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>שש בש מקוון</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#1a0f00;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
#app{width:100%;max-width:900px}

.lobby-wrap{max-width:420px;margin:0 auto}
.logo{text-align:center;padding:2rem 0 1rem}
.logo-title{font-size:32px;font-weight:bold;color:#d4a843;letter-spacing:2px}
.logo-sub{font-size:14px;color:#a07830;margin-top:4px}
.lobby-card{background:#2d1a00;border:1px solid #5a3a10;border-radius:16px;padding:1.75rem}
.field{margin-bottom:1rem}
.field label{display:block;font-size:13px;font-weight:bold;color:#d4a843;margin-bottom:6px}
.field input{width:100%;padding:10px 12px;font-size:15px;border:1px solid #5a3a10;border-radius:8px;outline:none;font-family:Arial,sans-serif;direction:rtl;background:#1a0f00;color:#f5e6c8}
.field input:focus{border-color:#d4a843;box-shadow:0 0 0 3px rgba(212,168,67,0.2)}
.err{font-size:13px;color:#e07070;min-height:18px;margin-top:6px}
.btn{width:100%;padding:13px;font-size:15px;font-weight:bold;cursor:pointer;border-radius:10px;border:none;font-family:Arial,sans-serif;margin-top:0.5rem}
.btn-gold{background:#d4a843;color:#1a0f00}
.btn-gold:hover{background:#e0b850}
.btn-outline{background:transparent;color:#d4a843;border:1px solid #d4a843}
.btn-outline:hover{background:rgba(212,168,67,0.1)}
.btn-gray{background:#333;color:#aaa;border:1px solid #555}
.btn-gray:hover{background:#444}
.divider{text-align:center;font-size:13px;color:#5a3a10;margin:1rem 0}

.wait-wrap{max-width:420px;margin:0 auto;text-align:center;padding-top:2rem}
.code-box{background:#2d1a00;border:2px dashed #5a3a10;border-radius:12px;padding:1.5rem;margin:1.5rem 0}
.code-label{font-size:13px;color:#a07830;margin-bottom:8px}
.code-num{font-size:48px;font-weight:bold;color:#d4a843;letter-spacing:12px}
.code-hint{font-size:12px;color:#5a3a10;margin-top:8px}
.spin-box{display:flex;align-items:center;justify-content:center;gap:10px;color:#a07830;font-size:14px;margin-bottom:1.5rem}
.spinner{width:16px;height:16px;border:2px solid #5a3a10;border-top-color:#d4a843;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.game-wrap{display:grid;grid-template-columns:1fr 260px;gap:12px;align-items:start}

.board-outer{background:#2d1a00;border:3px solid #5a3a10;border-radius:12px;padding:8px}
.board-frame{background:#8B4513;border-radius:6px;overflow:hidden;position:relative;user-select:none}
.board-top{display:grid;grid-template-columns:repeat(6,1fr) 40px repeat(6,1fr);height:145px}
.board-bottom{display:grid;grid-template-columns:repeat(6,1fr) 40px repeat(6,1fr);height:145px}
.board-mid{background:#5a3a10;height:30px;display:flex;align-items:center;justify-content:center;gap:8px}

.point{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:4px;cursor:pointer}
.point-b{flex-direction:column-reverse;padding-top:0;padding-bottom:4px}
.point.light{background:#c49a2a}
.point.dark{background:#8B0000}
.point:hover{filter:brightness(1.2)}
.point.valid-dest{background:rgba(80,200,80,0.4)!important}
.point.selected-src{outline:3px solid #d4a843;outline-offset:-3px}

.pnum{position:absolute;font-size:8px;color:rgba(255,255,255,0.35);bottom:2px;left:50%;transform:translateX(-50%)}
.point-b .pnum{bottom:auto;top:2px}

.checker{width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:bold;flex-shrink:0;margin:1px 0;position:relative;z-index:1}
.cw{background:radial-gradient(circle at 35% 35%,#fff,#bbb);color:#333;border:2px solid #999}
.cb{background:radial-gradient(circle at 35% 35%,#444,#111);color:#eee;border:2px solid #000}
.checker.sel{box-shadow:0 0 0 3px #d4a843}

.bar-col{background:#5a3a10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.bar-col:hover{background:#6a4a20}

.dice-area{display:flex;gap:8px;align-items:center;justify-content:center;padding:8px 0;flex-wrap:wrap}
.die{width:38px;height:38px;background:#f5f5f5;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid #d4a843;box-shadow:2px 2px 0 rgba(0,0,0,0.4)}
.die.used{opacity:0.25;border-color:#555}
.btn-roll{padding:9px 20px;font-size:13px;font-weight:bold;cursor:pointer;border-radius:8px;border:none;background:#d4a843;color:#1a0f00;font-family:Arial}
.btn-roll:hover{background:#e0b850}
.btn-roll:disabled{background:#444;color:#777;cursor:default}
.btn-skip{padding:9px 14px;font-size:12px;font-weight:bold;cursor:pointer;border-radius:8px;border:1px solid #555;background:#333;color:#aaa;font-family:Arial}
.btn-skip:hover{background:#444}

.side-col{display:flex;flex-direction:column;gap:10px}
.player-card{background:#2d1a00;border:1px solid #5a3a10;border-radius:10px;padding:10px 12px}
.player-card.active{border-color:#d4a843}
.pc-row{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.pc-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0}
.pc-dot-w{background:radial-gradient(circle at 35% 35%,#fff,#bbb);border:1px solid #999}
.pc-dot-b{background:radial-gradient(circle at 35% 35%,#444,#111);border:1px solid #000}
.pc-name{font-size:13px;font-weight:bold;color:#f5e6c8;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-you{font-size:10px;background:#d4a843;color:#1a0f00;border-radius:8px;padding:1px 7px}
.pc-info{font-size:11px;color:#a07830}
.pc-bar{font-size:11px;color:#e07070}

.status-box{background:#2d1a00;border:1px solid #5a3a10;border-radius:10px;padding:10px;text-align:center;font-size:13px;font-weight:bold;color:#d4a843;min-height:40px;display:flex;align-items:center;justify-content:center}

.home-row{display:flex;gap:6px;justify-content:center}
.home-box{background:#1a0f00;border:1px solid #5a3a10;border-radius:6px;padding:5px 8px;text-align:center;font-size:11px;color:#a07830;min-width:60px}
.home-count{font-size:20px;font-weight:bold;color:#d4a843}

.chat-box{background:#2d1a00;border:1px solid #5a3a10;border-radius:10px;display:flex;flex-direction:column;height:200px}
.chat-title{font-size:12px;font-weight:bold;color:#a07830;padding:7px 10px;border-bottom:1px solid #5a3a10}
.chat-msgs{flex:1;overflow-y:auto;padding:7px 10px;display:flex;flex-direction:column;gap:3px}
.msg{font-size:12px;line-height:1.4}
.msg-name{font-weight:bold;color:#d4a843}
.msg-text{color:#f5e6c8}
.msg-sys{color:#a07830;font-style:italic}
.chat-inp-row{display:flex;gap:5px;padding:6px 8px;border-top:1px solid #5a3a10}
.chat-inp{flex:1;padding:5px 8px;font-size:12px;border:1px solid #5a3a10;border-radius:6px;outline:none;background:#1a0f00;color:#f5e6c8;font-family:Arial;direction:rtl}
.chat-inp:focus{border-color:#d4a843}
.chat-btn{padding:5px 10px;font-size:12px;font-weight:bold;cursor:pointer;border-radius:6px;border:none;background:#d4a843;color:#1a0f00;font-family:Arial}
</style>
</head>
<body>
<div id="app">

<div id="screen-lobby">
  <div class="lobby-wrap">
    <div class="logo">
      <div class="logo-title">שש בש</div>
      <div class="logo-sub">משחק מקוון בזמן אמת</div>
    </div>
    <div class="lobby-card">
      <div class="field"><label>השם שלך</label><input type="text" id="input-name" placeholder="הכנס שם..." maxlength="18"/></div>
      <button class="btn btn-gold" id="btn-create">צור חדר חדש</button>
      <div class="divider">— או —</div>
      <div class="field"><label style="color:#a07830">הצטרף לחדר קיים</label>
        <input type="text" id="input-code" placeholder="קוד בן 4 ספרות" maxlength="4" style="letter-spacing:6px;font-size:20px;text-align:center"/>
      </div>
      <button class="btn btn-outline" id="btn-join">הצטרף</button>
      <div class="err" id="err-lobby"></div>
    </div>
  </div>
</div>

<div id="screen-waiting" style="display:none">
  <div class="wait-wrap">
    <div class="logo-title" style="color:#d4a843;font-size:24px">ממתין לחבר...</div>
    <div class="code-box">
      <div class="code-label">קוד החדר שלך</div>
      <div class="code-num" id="display-code"></div>
      <div class="code-hint">שלח את הקוד לחבר שלך</div>
    </div>
    <div class="spin-box"><div class="spinner"></div>ממתין לחבר להתחבר...</div>
    <button class="btn btn-gray" id="btn-cancel" style="max-width:180px;margin:0 auto;display:block">ביטול</button>
  </div>
</div>

<div id="screen-game" style="display:none">
  <div class="game-wrap">
    <div class="board-col">
      <div class="board-outer">
        <div class="board-frame" id="board-frame"></div>
      </div>
      <div class="dice-area" id="dice-area"></div>
      <div class="home-row" style="margin-top:4px">
        <div class="home-box"><div class="home-count" id="home-w">0</div><div>לבן בבית</div></div>
        <div class="home-box"><div class="home-count" id="home-b">0</div><div>שחור בבית</div></div>
      </div>
    </div>
    <div class="side-col">
      <div class="player-card" id="card-w">
        <div class="pc-row">
          <div class="pc-dot pc-dot-w"></div>
          <div class="pc-name" id="name-w">לבן</div>
          <div id="you-w" style="display:none" class="pc-you">אתה</div>
        </div>
        <div class="pc-info" id="score-w">0 נצחונות</div>
        <div class="pc-bar" id="bar-w" style="display:none"></div>
      </div>
      <div class="status-box" id="status-box">טוען...</div>
      <div class="player-card" id="card-b">
        <div class="pc-row">
          <div class="pc-dot pc-dot-b"></div>
          <div class="pc-name" id="name-b">שחור</div>
          <div id="you-b" style="display:none" class="pc-you">אתה</div>
        </div>
        <div class="pc-info" id="score-b">0 נצחונות</div>
        <div class="pc-bar" id="bar-b" style="display:none"></div>
      </div>
      <div class="chat-box">
        <div class="chat-title">💬 צ'אט</div>
        <div class="chat-msgs" id="chat-msgs"></div>
        <div class="chat-inp-row">
          <input type="text" class="chat-inp" id="chat-inp" placeholder="הקלד הודעה..." maxlength="100"/>
          <button class="chat-btn" id="chat-send">שלח</button>
        </div>
      </div>
      <button class="btn btn-gray" id="btn-leave" style="font-size:13px;padding:10px;margin-top:0">יציאה</button>
    </div>
  </div>
</div>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, push, remove }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const cfg = {
  apiKey:"AIzaSyC75HdJ7SIe-R3AZBw6cYfnUeEXTP1252Q",
  authDomain:"backgammon-cb0f4.firebaseapp.com",
  databaseURL:"https://backgammon-cb0f4-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"backgammon-cb0f4",
  storageBucket:"backgammon-cb0f4.firebasestorage.app",
  messagingSenderId:"336878587258",
  appId:"1:336878587258:web:0fb1eecc4b857e0bcb1ac3"
};

const db = getDatabase(initializeApp(cfg));

let myName='', myColor='', roomCode='', unsub=null, unsubChat=null;
let selectedPoint=-1, lastState=null;

const FACES=['','⚀','⚁','⚂','⚃','⚄','⚅'];
const WINS_LINE=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function initBoard(){
  const b=Array(26).fill(0);
  b[1]=2;b[12]=5;b[17]=3;b[19]=5;
  b[24]=-2;b[13]=-5;b[8]=-3;b[6]=-5;
  return b;
}

function initGame(first){
  return {
    board:initBoard(), turn:first,
    dice:[], diceUsed:[],
    phase:'roll',
    barWhite:0, barBlack:0,
    homeWhite:0, homeBlack:0,
    winner:null,
    scores:{white:0,black:0}
  };
}

function randCode(){ return String(Math.floor(1000+Math.random()*9000)); }

function showScreen(id){
  ['screen-lobby','screen-waiting','screen-game'].forEach(s=>
    document.getElementById(s).style.display=s===id?'':'none');
}

// ---- LOBBY ----
document.getElementById('btn-create').onclick=async()=>{
  const name=document.getElementById('input-name').value.trim();
  const err=document.getElementById('err-lobby');
  if(!name){err.textContent='יש להזין שם';return;}
  err.textContent='';
  myName=name; myColor='white'; roomCode=randCode();
  await set(ref(db,'rooms/'+roomCode),{
    playerWhite:name, playerBlack:'',
    status:'waiting',
    game:initGame('white'),
    ts:Date.now()
  });
  document.getElementById('display-code').textContent=roomCode;
  showScreen('screen-waiting');
  startListening();
};

document.getElementById('btn-join').onclick=async()=>{
  const name=document.getElementById('input-name').value.trim();
  const code=document.getElementById('input-code').value.trim();
  const err=document.getElementById('err-lobby');
  if(!name){err.textContent='יש להזין שם';return;}
  if(!/^\d{4}$/.test(code)){err.textContent='קוד חייב להיות 4 ספרות';return;}
  err.textContent='';
  const snap=await get(ref(db,'rooms/'+code));
  if(!snap.exists()){err.textContent='חדר לא נמצא — בדוק את הקוד';return;}
  const d=snap.val();
  if(d.playerBlack){err.textContent='החדר כבר מלא';return;}
  myName=name; myColor='black'; roomCode=code;
  await update(ref(db,'rooms/'+code),{playerBlack:name,status:'playing'});
  showScreen('screen-game');
  startListening();
  startChat();
};

document.getElementById('btn-cancel').onclick=()=>doLeave(true);
document.getElementById('btn-leave').onclick=()=>doLeave(true);

// ---- LISTEN ----
function startListening(){
  if(unsub) unsub();
  unsub=onValue(ref(db,'rooms/'+roomCode),snap=>{
    if(!snap.exists()){doLeave(false);return;}
    const d=snap.val();
    if(myColor==='white'&&d.status==='waiting'){showScreen('screen-waiting');return;}
    if(d.status==='playing'||d.status==='gameover'){
      showScreen('screen-game');
      if(!unsubChat) startChat();
      lastState=d;
      selectedPoint=-1;
      renderGame(d);
    }
  });
}

function startChat(){
  if(unsubChat) unsubChat();
  unsubChat=onValue(ref(db,'rooms/'+roomCode+'/chat'),snap=>{
    const msgs=snap.val()||{};
    const el=document.getElementById('chat-msgs');
    el.innerHTML='';
    Object.values(msgs).sort((a,b)=>a.ts-b.ts).forEach(m=>{
      const div=document.createElement('div');
      div.className='msg';
      if(m.sys) div.innerHTML=`<span class="msg-sys">${esc(m.text)}</span>`;
      else div.innerHTML=`<span class="msg-name">${esc(m.name)}: </span><span class="msg-text">${esc(m.text)}</span>`;
      el.appendChild(div);
    });
    el.scrollTop=el.scrollHeight;
  });
}

document.getElementById('chat-send').onclick=sendChat;
document.getElementById('chat-inp').onkeydown=e=>{if(e.key==='Enter')sendChat();};
async function sendChat(){
  const inp=document.getElementById('chat-inp');
  const text=inp.value.trim();
  if(!text)return;
  inp.value='';
  await push(ref(db,'rooms/'+roomCode+'/chat'),{name:myName,text,ts:Date.now()});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function sysMsg(text){
  await push(ref(db,'rooms/'+roomCode+'/chat'),{sys:true,text,ts:Date.now()});
}

// ---- RENDER ----
function renderGame(d){
  const g=d.game;
  document.getElementById('name-w').textContent=d.playerWhite||'לבן';
  document.getElementById('name-b').textContent=d.playerBlack||'שחור';
  document.getElementById('you-w').style.display=myColor==='white'?'inline-block':'none';
  document.getElementById('you-b').style.display=myColor==='black'?'inline-block':'none';
  document.getElementById('score-w').textContent=(g.scores?.white||0)+' נצחונות';
  document.getElementById('score-b').textContent=(g.scores?.black||0)+' נצחונות';
  document.getElementById('home-w').textContent=g.homeWhite||0;
  document.getElementById('home-b').textContent=g.homeBlack||0;
  const bw=g.barWhite||0,bb=g.barBlack||0;
  const bwEl=document.getElementById('bar-w'),bbEl=document.getElementById('bar-b');
  bwEl.style.display=bw>0?'block':'none'; bwEl.textContent='בבר: '+bw+' כלים';
  bbEl.style.display=bb>0?'block':'none'; bbEl.textContent='בבר: '+bb+' כלים';
  document.getElementById('card-w').className='player-card'+(g.turn==='white'?' active':'');
  document.getElementById('card-b').className='player-card'+(g.turn==='black'?' active':'');
  renderStatus(d);
  renderBoard(d);
  renderDiceArea(d);
}

function renderStatus(d){
  const g=d.game;
  const el=document.getElementById('status-box');
  if(g.phase==='gameover'){
    const wname=g.winner==='white'?d.playerWhite:d.playerBlack;
    el.textContent=g.winner===myColor?'ניצחת! 🎉':wname+' ניצח!';
    return;
  }
  if(g.turn!==myColor){
    el.textContent='ממתין ל'+(myColor==='white'?d.playerBlack:d.playerWhite)+'...';
    return;
  }
  if(g.phase==='roll') el.textContent='זרוק את הקוביות! 🎲';
  else el.textContent=selectedPoint>=0?'בחר יעד':'בחר כלי להזזה';
}

function renderBoard(d){
  const g=d.game;
  const board=g.board||Array(26).fill(0);
  const isMyTurn=g.turn===myColor&&g.phase==='move';
  const moves=isMyTurn?getValidMoves(g):[];
  const validDests=selectedPoint>=0?new Set(moves.filter(m=>m.from===selectedPoint).map(m=>m.to)):new Set();
  const selectableSrcs=selectedPoint<0?new Set(moves.map(m=>m.from)):new Set();

  const frame=document.getElementById('board-frame');
  frame.innerHTML='';

  // TOP row: points 13..18, bar, 19..24
  const topDiv=document.createElement('div');
  topDiv.className='board-top';
  for(let p=13;p<=24;p++){
    if(p===19){topDiv.appendChild(makeBarCell(g,isMyTurn,moves,'top'));}
    topDiv.appendChild(makePointCell(p,'top',board,isMyTurn,validDests,selectableSrcs,g));
  }
  frame.appendChild(topDiv);

  // MID
  const mid=document.createElement('div');
  mid.className='board-mid';
  mid.innerHTML='<span style="color:#a07830;font-size:11px">בר</span>';
  frame.appendChild(mid);

  // BOTTOM row: points 12..7, bar, 6..1
  const botDiv=document.createElement('div');
  botDiv.className='board-bottom';
  for(let p=12;p>=1;p--){
    if(p===6){botDiv.appendChild(makeBarCell(g,isMyTurn,moves,'bot'));}
    botDiv.appendChild(makePointCell(p,'bot',board,isMyTurn,validDests,selectableSrcs,g));
  }
  frame.appendChild(botDiv);
}

function makePointCell(p,pos,board,isMyTurn,validDests,selectableSrcs,g){
  const div=document.createElement('div');
  const isLight=((p%2===0&&p<=12)||(p%2===1&&p>=13));
  div.className='point '+(pos==='bot'?'point-b ':'')+((p<=12?p:p-12)%2===0?'light':'dark');
  // alternate colors nicely
  div.className='point '+(pos==='bot'?'point-b ':'')+(p%2===0?'light':'dark');

  if(validDests.has(p)) div.classList.add('valid-dest');
  if(selectedPoint===p) div.classList.add('selected-src');

  const count=board[p]||0;
  const abs=Math.abs(count);
  const color=count>0?'white':'black';
  if(abs>0){
    const show=Math.min(abs,5);
    for(let i=0;i<show;i++){
      div.appendChild(mkChecker(color,i===0&&abs>1?abs:null,selectedPoint===p&&i===0));
    }
  }

  const numEl=document.createElement('div');
  numEl.className='pnum'; numEl.textContent=p;
  div.appendChild(numEl);

  div.onclick=()=>handleClick(p,g);
  return div;
}

function makeBarCell(g,isMyTurn,moves,pos){
  const div=document.createElement('div');
  div.className='bar-col';
  // top bar shows black pieces (black enters from top, points 19-24)
  // bot bar shows white pieces (white enters from bottom, points 1-6)
  const isTop=pos==='top';
  const color=isTop?'black':'white';
  const barCount=isTop?(g.barBlack||0):(g.barWhite||0);
  const barPoint=isTop?0:25;

  if(barCount>0){
    for(let i=0;i<Math.min(barCount,3);i++){
      div.appendChild(mkChecker(color,i===0&&barCount>1?barCount:null,selectedPoint===barPoint));
    }
  }
  if(isMyTurn&&myColor===color&&barCount>0){
    div.onclick=()=>handleClick(barPoint,g);
    if(selectedPoint<0) div.style.outline='2px solid rgba(212,168,67,0.6)';
  }
  return div;
}

function mkChecker(color,count,isSel){
  const div=document.createElement('div');
  div.className='checker '+(color==='white'?'cw':'cb')+(isSel?' sel':'');
  if(count&&count>1) div.textContent=count;
  return div;
}

function renderDiceArea(d){
  const g=d.game;
  const el=document.getElementById('dice-area');
  el.innerHTML='';
  const isMyTurn=g.turn===myColor;

  if(g.phase==='roll'&&isMyTurn){
    const btn=document.createElement('button');
    btn.className='btn-roll'; btn.textContent='זרוק קוביות 🎲';
    btn.onclick=()=>rollDice(g);
    el.appendChild(btn);
    return;
  }
  if(g.dice&&g.dice.length>0){
    const isDouble=g.dice.length===2&&g.dice[0]===g.dice[1];
    const allDice=isDouble?[g.dice[0],g.dice[0],g.dice[0],g.dice[0]]:[...g.dice];
    const used=g.diceUsed||[];
    allDice.forEach((v,i)=>{
      const div=document.createElement('div');
      div.className='die'+(used[i]?' used':'');
      div.textContent=FACES[v]||v;
      el.appendChild(div);
    });
    if(isMyTurn&&g.phase==='move'){
      const btn=document.createElement('button');
      btn.className='btn-skip'; btn.textContent='דלג תור';
      btn.onclick=()=>skipTurn(g);
      el.appendChild(btn);
    }
  }
}

// ---- CLICK HANDLER ----
function handleClick(point,g){
  if(g.turn!==myColor||g.phase!=='move') return;
  const barCount=myColor==='white'?g.barWhite:g.barBlack;
  const barPoint=myColor==='white'?25:0;
  const moves=getValidMoves(g);

  if(barCount>0&&point!==barPoint){
    selectedPoint=barPoint;
    renderGame(lastState); return;
  }

  if(selectedPoint<0){
    const board=g.board||Array(26).fill(0);
    const cnt=board[point]||0;
    const isBar=point===25||point===0;
    if(!isBar){
      const color=cnt>0?'white':'black';
      if(color!==myColor||cnt===0) return;
    } else {
      if(barCount===0) return;
    }
    if(!moves.some(m=>m.from===point)) return;
    selectedPoint=point;
    renderGame(lastState);
  } else {
    const validForSrc=moves.filter(m=>m.from===selectedPoint);
    const match=validForSrc.find(m=>m.to===point);
    if(match){ applyMove(match,g); selectedPoint=-1; }
    else if(point===selectedPoint){ selectedPoint=-1; renderGame(lastState); }
    else {
      // try re-select
      const board=g.board||Array(26).fill(0);
      const cnt=board[point]||0;
      const color=cnt>0?'white':'black';
      if(color===myColor&&cnt!==0&&moves.some(m=>m.from===point)){
        selectedPoint=point; renderGame(lastState);
      } else { selectedPoint=-1; renderGame(lastState); }
    }
  }
}

// ---- GAME LOGIC ----
async function rollDice(g){
  if(g.turn!==myColor||g.phase!=='roll') return;
  const d1=Math.ceil(Math.random()*6), d2=Math.ceil(Math.random()*6);
  const dice=[d1,d2];
  const isDouble=d1===d2;
  const diceUsed=isDouble?[false,false,false,false]:[false,false];
  const newG={...g,dice,diceUsed,phase:'move'};
  if(getValidMoves(newG).length===0){
    await sysMsg((myColor==='white'?lastState.playerWhite:lastState.playerBlack)+': אין מהלכים אפשריים');
    const next=g.turn==='white'?'black':'white';
    await update(ref(db,'rooms/'+roomCode+'/game'),{dice,diceUsed,phase:'roll',turn:next});
    return;
  }
  await update(ref(db,'rooms/'+roomCode+'/game'),{dice,diceUsed,phase:'move'});
}

async function applyMove(move,g){
  const board=[...g.board];
  let bw=g.barWhite||0, bb=g.barBlack||0;
  let hw=g.homeWhite||0, hb=g.homeBlack||0;
  const diceUsed=[...(g.diceUsed||[])];

  // remove from source
  if(move.from===25) bw--;
  else if(move.from===0) bb--;
  else { if(myColor==='white') board[move.from]--; else board[move.from]++; }

  // place on dest
  if(move.to===0&&myColor==='white'){ hw++; }
  else if(move.to===25&&myColor==='black'){ hb++; }
  else {
    const dest=board[move.to]||0;
    if(myColor==='white'&&dest===-1){ board[move.to]=1; bb++; await sysMsg('הכאה! כלי שחור עבר לבר'); }
    else if(myColor==='black'&&dest===1){ board[move.to]=-1; bw++; await sysMsg('הכאה! כלי לבן עבר לבר'); }
    else { if(myColor==='white') board[move.to]++; else board[move.to]--; }
  }

  diceUsed[move.dieIdx]=true;

  // check win
  if(hw>=15||hb>=15){
    const winner=hw>=15?'white':'black';
    const scores={...(g.scores||{white:0,black:0})};
    scores[winner]=(scores[winner]||0)+1;
    await update(ref(db,'rooms/'+roomCode+'/game'),{board,barWhite:bw,barBlack:bb,homeWhite:hw,homeBlack:hb,diceUsed,winner,phase:'gameover',scores});
    await sysMsg('🏆 '+(winner===myColor?myName:getOther())+' ניצח במשחק!');
    return;
  }

  const tempG={...g,board,barWhite:bw,barBlack:bb,homeWhite:hw,homeBlack:hb,diceUsed};
  if(getValidMoves(tempG).length===0){
    const next=g.turn==='white'?'black':'white';
    await update(ref(db,'rooms/'+roomCode+'/game'),{board,barWhite:bw,barBlack:bb,homeWhite:hw,homeBlack:hb,diceUsed,phase:'roll',turn:next,dice:[],diceUsed:[]});
  } else {
    await update(ref(db,'rooms/'+roomCode+'/game'),{board,barWhite:bw,barBlack:bb,homeWhite:hw,homeBlack:hb,diceUsed});
  }
}

async function skipTurn(g){
  const next=g.turn==='white'?'black':'white';
  await update(ref(db,'rooms/'+roomCode+'/game'),{phase:'roll',turn:next,dice:[],diceUsed:[]});
}

function getOther(){
  if(!lastState) return 'יריב';
  return myColor==='white'?lastState.playerBlack:lastState.playerWhite;
}

// ---- VALID MOVES ----
function getValidMoves(g){
  const board=g.board||Array(26).fill(0);
  const dice=g.dice||[];
  const diceUsed=g.diceUsed||[];
  const isWhite=g.turn==='white';
  const bw=g.barWhite||0, bb=g.barBlack||0;
  const barCount=isWhite?bw:bb;
  const hw=g.homeWhite||0, hb=g.homeBlack||0;
  const moves=[];

  const isDouble=dice.length===2&&dice[0]===dice[1];
  const allDice=isDouble?[dice[0],dice[0],dice[0],dice[0]]:[...dice];
  const avail=allDice.map((v,i)=>({v,i})).filter((_,i)=>!diceUsed[i]);
  if(!avail.length) return [];

  // deduplicate by value (avoid duplicate move entries)
  const seen=new Set();
  const uniqAvail=avail.filter(d=>{ if(seen.has(d.v)) return false; seen.add(d.v); return true; });

  const canBearOff=isWhite
    ?(bw===0&&allWhiteHome(board,hw))
    :(bb===0&&allBlackHome(board,hb));

  if(barCount>0){
    const from=isWhite?25:0;
    uniqAvail.forEach(({v,i})=>{
      const to=isWhite?v:(25-v);
      if(to>=1&&to<=24){
        const dest=board[to]||0;
        const blocked=isWhite?dest<=-2:dest>=2;
        if(!blocked) moves.push({from,to,dieIdx:avail.find(a=>a.v===v).i,die:v});
      }
    });
    return moves;
  }

  for(let p=1;p<=24;p++){
    const cnt=board[p]||0;
    if(isWhite&&cnt<=0) continue;
    if(!isWhite&&cnt>=0) continue;
    uniqAvail.forEach(({v})=>{
      const dieIdx=avail.find(a=>a.v===v).i;
      if(isWhite){
        const to=p+v;
        if(to<=24){ const dest=board[to]||0; if(dest>=-1) moves.push({from:p,to,dieIdx,die:v}); }
        else if(canBearOff){
          if(to===25) moves.push({from:p,to:0,dieIdx,die:v});
          else { const higher=board.slice(p+1,25).some(x=>x>0); if(!higher) moves.push({from:p,to:0,dieIdx,die:v}); }
        }
      } else {
        const to=p-v;
        if(to>=1){ const dest=board[to]||0; if(dest<=1) moves.push({from:p,to,dieIdx,die:v}); }
        else if(canBearOff){
          if(to===0) moves.push({from:p,to:25,dieIdx,die:v});
          else { const lower=board.slice(1,p).some(x=>x<0); if(!lower) moves.push({from:p,to:25,dieIdx,die:v}); }
        }
      }
    });
  }
  return moves;
}

function allWhiteHome(board,hw){
  let t=hw; for(let p=19;p<=24;p++) if(board[p]>0) t+=board[p]; return t>=15;
}
function allBlackHome(board,hb){
  let t=hb; for(let p=1;p<=6;p++) if(board[p]<0) t+=Math.abs(board[p]); return t>=15;
}

function doLeave(clean=true){
  if(unsub){unsub();unsub=null;}
  if(unsubChat){unsubChat();unsubChat=null;}
  if(clean&&roomCode){
    if(myColor==='white') remove(ref(db,'rooms/'+roomCode));
    else update(ref(db,'rooms/'+roomCode),{playerBlack:'',status:'waiting'});
  }
  myName='';myColor='';roomCode='';selectedPoint=-1;lastState=null;
  document.getElementById('input-name').value='';
  document.getElementById('input-code').value='';
  document.getElementById('err-lobby').textContent='';
  showScreen('screen-lobby');
}
</script>
